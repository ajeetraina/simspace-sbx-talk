# The "Intro to Docker Sandboxes" talk deck, presented in Simspace as full-bleed
# slides. Every page is a full-bleed image so the branding matches the master
# exactly. The sibling hands-on lab's simulator is wired in, so the scripted
# terminal demos can be spliced into the deck if desired (see spec/slidedeck.md
# in dockersamples/simspace).
kind: slides
title: "Intro to Docker Sandboxes - Slides"
description: >
  The talk: Contain, Control, Choice, Capacity - a trusted boundary for AI agents.
  Watch the session, then do the hands-on lab.

# Landing-page card. `order: 1` puts the deck ahead of the lab, so it reads as
# "watch the talk, then do the lab". labs.json is GENERATED from this block -
# never edit labs.json by hand.
catalog:
  icon: slideshow
  order: 1
  tags: ["ai agents", "sandboxes", "slides", "start here"]
  estimatedMinutes: 30

version: "2.0.0"

# Dark matches the deck's deep-blue Docker slides, so any native live-demo slides
# sit seamlessly among the image slides.
theme: dark

# Reuse the SIBLING LAB's simulator so any spliced-in demos run the exact scripted
# commands learners run in the lab - the two can't drift apart. State is NOT
# shared: this deck gets its own fresh machine (spec/slidedeck.md 7.2).
simulator: ../intro-to-docker-sandboxes/simulator.yaml

# One demo terminal. `demo` is the conventional deck id referenced by
# `::terminal{id=demo}` if you splice a live demo into the deck.
terminals:
  - id: demo
    title: Demo
    icon: terminal

# `slides:` is the deck alias for `sections:`. One chapter holds the whole deck;
# slides within it are split on lines of exactly `---`.
slides:
  - title: Talk
    contentPath: deck.md
